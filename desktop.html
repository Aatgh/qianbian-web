<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="a62466">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9b246b" />
    <meta
      name="description"
      content="千变电脑端工作区：对话、技能、自动化与上下文协作。"
    />
    <title>千变 · 电脑端工作区</title>
    <script>
      try {
        if (localStorage.getItem("qianbian-desktop-auth") !== "true") {
          document.documentElement.classList.add("login-pending");
        }
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/icon-32.png" />
    <link rel="stylesheet" href="tokens.css?v=20261126p1" />
    <link rel="stylesheet" href="desktop.css?v=20261126p1" />
    <link rel="stylesheet" href="desktop-refresh.css?v=20261127p1" />
    <link rel="stylesheet" href="desktop-workspace.css?v=20261126p1" />
    <link rel="stylesheet" href="desktop-login.css?v=20261126p1" />
    <link rel="stylesheet" href="typography.css?v=20261126p1b" />
    <link rel="stylesheet" href="redesign.css?v=20261126p2c" />
  </head>
  <body class="desktop-reference">
    <div class="login-gate login-starfield-preview login-box-open" id="login-gate" hidden>
      <div class="login-atmosphere" aria-hidden="true">
        <div class="login-grid"></div>
        <div class="login-beam login-beam-a"></div>
        <div class="login-beam login-beam-b"></div>
        <div class="login-vignette"></div>
      </div>
      <canvas id="login-three-canvas" class="login-three-canvas" aria-hidden="true"></canvas>
      <canvas
        class="login-galaxy-canvas"
        id="login-galaxy-canvas"
        aria-hidden="true"
      ></canvas>

      <header class="login-masthead">
        <div class="login-secure-status">
          <i data-lucide="shield-check"></i>
          <span>私密工作区</span>
          <b aria-hidden="true"></b>
        </div>
      </header>

      <main class="login-layout">
        <section class="login-visual" aria-label="千变品牌展示">
          <div class="login-orbit" aria-hidden="true">
            <span class="login-orbit-ring login-orbit-ring-a"></span>
            <span class="login-orbit-ring login-orbit-ring-b"></span>
            <span class="login-orbit-ring login-orbit-ring-c"></span>
            <span class="login-orbit-scan"></span>
            <span class="login-prism">
              <span class="login-prism-glass">
                <img src="assets/brand/qianbian-tile.png" alt="" />
              </span>
            </span>
            <span class="login-orbit-label login-orbit-label-a">理解</span>
            <span class="login-orbit-label login-orbit-label-b">创造</span>
            <span class="login-orbit-label login-orbit-label-c">协作</span>
          </div>

          <div class="login-visual-copy">
            <span class="login-kicker">A workspace that moves with you</span>
            <h1>让每一次意图<br /><em>自然成形。</em></h1>
            <p>
              从一句想法到完整成果，千变会把上下文、技能和执行过程收拢到同一个安静的工作空间。
            </p>
            <div class="login-capability-row" aria-label="工作方式">
              <span><i data-lucide="sparkles"></i>理解上下文</span>
              <span><i data-lucide="command"></i>调用能力</span>
              <span><i data-lucide="orbit"></i>持续推进</span>
            </div>
          </div>
        </section>

        <section class="login-panel-wrap" id="login-panel-wrap">
          <div class="login-panel">
            <span class="login-panel-border" aria-hidden="true"></span>
            <div class="login-panel-head">
              <div class="login-brand-lockup">
                <img src="assets/brand/qianbian-tile.png" alt="" />
                <span>千变</span>
              </div>
              <h2 id="login-title">登录千变</h2>
              <p class="login-subtitle">继续你的工作空间</p>
            </div>

            <form class="login-form" id="login-form" novalidate>
              <div class="login-field" id="login-account-field">
                <input
                  id="login-account"
                  type="text"
                  name="identifier"
                  autocomplete="username"
                  aria-label="账号/邮箱/手机号"
                  placeholder="账号/邮箱/手机号"
                />
                <span class="login-field-line" aria-hidden="true"></span>
              </div>

              <div class="login-mode-panel" data-login-panel="password">
                <div class="login-field" data-login-field="password">
                  <input
                    id="login-password"
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    aria-label="密码"
                    placeholder="密码"
                  />
                  <button
                    class="login-password-toggle"
                    type="button"
                    aria-label="显示密码"
                    title="显示密码"
                  >
                    <i data-lucide="eye"></i>
                  </button>
                  <span class="login-field-line" aria-hidden="true"></span>
                </div>
              </div>

              <div class="login-mode-panel" data-login-panel="code" hidden>
                <div class="login-field" data-login-field="code">
                  <input
                    id="login-code"
                    type="text"
                    name="code"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    maxlength="6"
                    aria-label="验证码"
                    placeholder="验证码"
                  />
                  <button class="login-code-button" type="button">获取验证码</button>
                  <span class="login-field-line" aria-hidden="true"></span>
                </div>
              </div>

              <div class="login-mode-switch-row">
                <button class="login-mode-switch" type="button" data-login-mode="code">验证码登录</button>
              </div>

              <div class="login-meta-row">
                <label class="login-checkbox">
                  <input id="login-remember" type="checkbox" checked />
                  <span aria-hidden="true"><i data-lucide="check"></i></span>
                  <b>保持登录</b>
                </label>
              </div>

              <div
                class="login-error"
                id="login-error"
                role="alert"
                aria-live="assertive"
                hidden
              ></div>

              <button class="login-submit" type="submit" aria-label="登录">
                <span class="login-submit-label">进入工作区</span>
                <i data-lucide="arrow-right" aria-hidden="true"></i>
                <span class="login-submit-loader" aria-hidden="true"></span>
              </button>
            </form>
          </div>
        </section>
      </main>

      <footer class="login-footer">
        <span><i data-lucide="lock-keyhole"></i>连接由本地工作区保护</span>
        <span class="login-footer-pulse" aria-hidden="true"></span>
        <span>千变桌面端 · 安全登录</span>
      </footer>

      <div class="login-success" id="login-success" hidden>
        <span class="login-success-halo" aria-hidden="true"></span>
        <span class="login-success-mark"><i data-lucide="check"></i></span>
        <strong>身份已确认</strong>
        <small>正在进入你的工作区</small>
      </div>
    </div>

    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="主导航">
        <div class="sidebar-actions">
          <div class="sidebar-top">
            <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="关闭导航">
              <i data-lucide="x"></i>
            </button>
          </div>

          <nav class="primary-nav" aria-label="工作区导航">
            <button class="nav-item rail-expand is-active" id="session-nav" data-side-panel="sessions" data-tooltip="会话" type="button" aria-current="page">
              <i data-lucide="message-square"></i>
              <span>会话</span>
            </button>
            <button class="nav-item rail-expand" id="command-search" data-side-panel="search" data-tooltip="搜索" type="button">
              <i data-lucide="search"></i>
              <span>搜索</span>
            </button>
          </nav>
          <div class="sidebar-widget-nav" id="desktop-ui-widget-host" hidden></div>

          <div class="sidebar-settings">
            <div id="sidebar-environment-host"></div>
            <button class="rail-tool rail-expand sidebar-settings-button" data-open-settings type="button" aria-label="设置">
              <i data-lucide="equal"></i>
              <span>设置</span>
            </button>
          </div>
        </div>
      </aside>

      <aside class="history-sidebar side-panel" id="side-panel" aria-label="侧边面板">
        <button class="icon-button side-panel-mobile-close" id="side-panel-close" type="button" aria-label="关闭侧边面板">
          <i data-lucide="x"></i>
        </button>

        <section class="side-panel-view is-active" data-side-panel-view="sessions">
          <div class="history-panel-head">
            <h2>会话</h2>
            <div class="history-head-actions">
              <span class="history-count" id="history-count">0</span>
              <button class="history-new-chat" id="new-chat" type="button" aria-label="新建对话" title="新建对话">
                <i data-lucide="square-pen"></i>
              </button>
            </div>
          </div>
          <label class="history-search">
            <i data-lucide="search"></i>
            <input id="history-filter" type="search" placeholder="搜索历史会话" autocomplete="off" />
          </label>
          <div class="history-session-scroll">
            <div class="session-list" id="session-list"></div>
          </div>
        </section>

        <section class="side-panel-view" data-side-panel-view="search" hidden>
          <header class="side-panel-title">
            <h2>搜索</h2>
          </header>
          <label class="side-search-input">
            <i data-lucide="search"></i>
            <input id="side-search-input" type="search" placeholder="搜索聊天记录、文件、目标" autocomplete="off" aria-label="搜索聊天记录、文件、目标" />
          </label>
          <div class="workspace-filter-row" id="side-search-filters" aria-label="搜索范围"></div>
          <div class="side-search-results" id="side-search-results"></div>
        </section>

      </aside>

      <main class="main-workspace">
        <header class="workspace-header">
          <div class="header-leading">
            <button class="icon-button menu-button" id="sidebar-open" type="button" aria-label="打开导航">
              <i data-lucide="panel-left"></i>
            </button>
            <button class="icon-button detail-back" id="detail-back" type="button" aria-label="返回上一级" hidden>
              <i data-lucide="arrow-left"></i>
            </button>
            <div class="page-heading">
              <div class="breadcrumb">
                <span>千变</span>
                <i data-lucide="chevron-right"></i>
                <span id="breadcrumb-current">新对话</span>
              </div>
              <h1 id="page-title">新对话</h1>
              <span class="header-environment" id="header-environment">
                <i data-lucide="monitor"></i>
                本机工作区
              </span>
            </div>
          </div>
          <div class="header-actions">
            <button class="icon-button context-toggle" id="context-toggle" type="button" aria-label="打开任务与配置" aria-expanded="false" aria-haspopup="dialog">
              <i data-lucide="panel-right"></i>
            </button>
            <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深色模式">
              <i data-lucide="moon"></i>
            </button>
          </div>
        </header>

        <section class="view-scroll" id="view-scroll" aria-live="polite"></section>

        <section class="composer-zone" id="composer-zone" aria-label="消息输入区">
          <div class="desktop-composer" id="desktop-composer"></div>
        </section>
      </main>

      <aside class="context-panel" id="context-panel" aria-label="上下文面板">
        <div class="desktop-brand-stage">
          <div
            class="desktop-affinity-ring"
            id="context-affinity-ring"
            style="--agent-progress:30%"
            role="progressbar"
            aria-label="用户与 Agent 契合度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="30"
          >
            <button class="desktop-affinity-logo" id="account-menu-button" type="button" aria-label="打开账号设置">
              <img src="assets/brand/qianbian-tile.png" alt="千变 Logo" />
            </button>
          </div>
          <strong class="desktop-brand-name">千变</strong>
          <strong class="desktop-affinity-value" id="context-affinity-value">30%</strong>
          <span class="desktop-affinity-label">用户与 Agent 契合度</span>
        </div>

        <div class="insight-panel-content" id="insight-panel-content" aria-live="polite"></div>
        <button class="skill-market-launcher" id="skill-market-launcher" data-open-skill-market type="button" hidden>技能市场</button>
      </aside>
    </div>

    <div class="mobile-scrim" id="mobile-scrim" hidden></div>

    <div class="rail-dialog-host" id="rail-dialog-host"></div>
    <div class="action-dialog-host" id="action-dialog-host"></div>
    <div class="settings-sheet-host" id="settings-sheet-host"></div>
    <div class="account-dialog-host" id="account-dialog-host"></div>

    <div class="command-palette" id="command-palette" hidden>
      <button class="command-backdrop" data-close-palette type="button" aria-label="关闭搜索"></button>
      <section class="command-dialog" role="dialog" aria-modal="true" aria-labelledby="command-title">
        <div class="command-input-wrap">
          <i data-lucide="search"></i>
          <input id="command-input" type="search" placeholder="搜索对话、技能或命令" autocomplete="off" />
        </div>
        <div class="command-results" id="command-results"></div>
      </section>
    </div>

    <div class="backend-prompt-host" id="backend-prompt-host"></div>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    <div class="sr-only" id="sr-status" aria-live="assertive"></div>
    <a class="icp-footer" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
      湘ICP备2026043985号-3
    </a>

    <script src="assets/lucide.min.js"></script>
    <script src="assets/login-three-scene.min.js?v=20261123o"></script>
    <script src="assets/mobile-qr.min.js?v=20261125stagea"></script>
    <script src="device-tasks.js?v=20261125stageb4"></script>
    <script src="device-settings.js?v=20261125stageb5"></script>
    <script src="data.js?v=20261127p1"></script>
    <script src="desktop-api.js?v=20261127p1"></script>
    <script src="assets/chat-timeline.js?v=20261125stagea"></script>
    <script src="assets/markdown.min.js?v=20261126chat1"></script>
    <script src="src/agent-workspace-ui.js?v=20261126f0"></script>
    <script src="desktop-app.js?v=20261127p1"></script>
    <script src="assets/login-galaxy.min.js?v=20261125login14"></script>
    <script src="desktop-login.js?v=20261126chat2"></script>
  </body>
</html>
